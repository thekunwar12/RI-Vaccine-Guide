<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RI Vaccine Guide — Forest Earth</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Source Sans 3',sans-serif;background:#f5f5f0;color:#3f3f46;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#14532d 0%,#166534 40%,#4ade80 100%);padding:32px 24px;text-align:center;position:relative;overflow:hidden}
#splash::before{content:'';position:absolute;top:-30%;right:-25%;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.06) 0%,transparent 70%)}
.s-logo{width:100px;height:100px;border-radius:22px;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;margin-bottom:32px;position:relative;z-index:1;box-shadow:0 8px 32px rgba(0,0,0,.2);overflow:hidden}
.s-logo img{width:72px;height:72px;object-fit:contain}
#splash h1{font-family:'Lora',serif;color:#fff;font-size:34px;font-weight:800;line-height:1.15;position:relative;z-index:1}
#splash .sh{color:rgba(255,255,255,.65);font-size:16px;font-weight:700;margin-top:6px;position:relative;z-index:1}
#splash .se{color:rgba(255,255,255,.45);font-size:13px;max-width:330px;line-height:1.6;margin:10px auto 26px;position:relative;z-index:1}
.s-feats{display:flex;flex-wrap:wrap;justify-content:center;margin-bottom:28px;max-width:380px;position:relative;z-index:1}
.s-feat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.75);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;margin:3px 4px}
.s-btn{background:#1e40af;color:#fff;border:none;padding:15px 46px;border-radius:12px;font-size:19px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25);font-family:inherit;transition:transform .15s;position:relative;z-index:1}
.s-btn:active{transform:scale(.95)}
.s-ft{margin-top:28px;font-size:11px;color:rgba(255,255,255,.3);position:relative;z-index:1;line-height:2}.s-ft strong{color:rgba(255,255,255,.65)}
#app{display:none;max-width:520px;margin:0 auto;min-height:100vh}
.hd{background:linear-gradient(135deg,#14532d,#15803d);color:#fff;padding:10px 14px;display:flex;align-items:center;position:-webkit-sticky;position:sticky;top:0;z-index:10;box-shadow:0 2px 16px rgba(0,0,0,.12)}
.h-logo{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;overflow:hidden;padding:3px;margin-right:10px}
.h-logo img{width:100%;height:100%;object-fit:contain}
.hd-txt{flex:1;min-width:0}
.hd h2{font-family:'Lora',serif;font-size:20px;font-weight:800;line-height:1.2}.hd .hs{font-size:12px;opacity:.7;font-weight:700}
.lang-sel{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2);padding:5px 8px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;outline:none;flex-shrink:0;margin-left:10px;-webkit-appearance:auto}
.lang-sel option{color:#333;background:#fff}
.ts{display:flex;padding:10px 6px 4px;justify-content:center}
.tb{display:flex;flex-direction:column;align-items:center;padding:10px 8px 8px;border-radius:10px;cursor:pointer;flex:1;max-width:120px;border:2px solid transparent;background:#fff;color:#3f3f46;box-shadow:0 1px 3px rgba(0,0,0,.05);font-family:inherit;transition:all .25s;margin:0 2px}
.tb.on{background:#14532d;color:#fff;border-color:#00b340}
.tb .ti{font-size:24px}.tb .tl{font-weight:800;font-size:14px}.tb .th{font-size:10px;opacity:.6;font-weight:700}
.ct{padding:10px 10px 16px}
.fr{text-align:center;font-size:10px;color:#3f3f4688;padding:12px 10px 24px;border-top:2px solid #e2e8f0;margin:4px 10px 0;line-height:2}
.fr .cr{display:inline-block;font-weight:800;color:#14532d;font-size:11px;padding:2px 12px;border-radius:16px;margin-top:2px}
.narr{background:#fff;border:2px solid #e2e8f0;border-radius:12px;padding:11px 13px;margin-bottom:12px;display:flex;align-items:flex-start;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.ni{font-size:26px;flex-shrink:0;margin-right:9px}.nt2{font-size:13px;color:#3f3f46;line-height:1.55;font-weight:500}
.ig{margin-bottom:12px}.ig>label{display:block;font-size:18px;font-weight:800;color:#14532d;margin-bottom:8px}
.dob-row{display:flex;width:100%}
.dob-col{flex:1;display:flex;flex-direction:column;margin-right:6px}
.dob-col:last-child{margin-right:0}
.dob-col-yr{flex:1.2}
.dob-lbl{font-size:13px;font-weight:800;color:#3f3f46;opacity:.8;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.dob-sel{width:100%;padding:10px 6px;border-radius:10px;border:2px solid #d1d5db;font-size:16px;font-weight:700;color:#3f3f46;background:#fff;outline:none;font-family:inherit;transition:border-color .2s;-webkit-appearance:auto;appearance:auto}
.dob-sel:focus{border-color:#00b340}
.ab{background:#fff;border:2px solid #4ade80;border-radius:12px;padding:10px 14px;font-size:15px;color:#14532d;margin-bottom:12px;text-align:center;font-weight:700}

/* SECTION HEADERS */
.sh2{font-weight:800;font-size:14px;padding:9px 12px;border-radius:10px;margin:14px 0 8px;display:flex;align-items:center}
.sh2.gn{background:#dcfce7;color:#065f46;border-left:4px solid #15803d}
.sh2.up{background:#fefce8;color:#a16207;border-left:4px solid #a16207}
.sh2.ms{background:#fee2e2;color:#991b1b;border-left:4px solid #dc2626}
.sh2.ng{background:#fff7ed;color:#c2410c;border-left:4px solid #fdba74}
.sh2 strong{margin-left:7px}.sc{background:rgba(0,0,0,.08);padding:2px 8px;border-radius:16px;font-size:11px;font-weight:800;margin-left:auto;margin-right:6px}

/* COLLAPSIBLE DROPDOWN */
.collapse-hdr{cursor:pointer;-webkit-user-select:none;user-select:none;position:relative;padding-right:38px}
.collapse-hdr::after{content:'▼';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;transition:transform .2s}
.collapse-hdr.open::after{transform:translateY(-50%) rotate(180deg)}
.collapse-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.collapse-body.open{max-height:9999px;overflow:visible}

/* GROUP HEADER (routine) */
.gh{font-weight:800;font-size:13px;color:#14532d;padding:7px 0;border-bottom:2px solid #e2e8f0;margin-bottom:8px}
.gh.ac{border-color:#15803d;color:#15803d}

/* VACCINE CARDS */
.vc{border-radius:12px;padding:11px 13px;margin-bottom:8px;border-width:2px;border-style:solid}
.vc.give-now{background:#dcfce7;border-color:#4ade80}
.vc.upcoming{background:#fefce8;border-color:#facc15}
.vc.missed{background:#fee2e2;border-color:#fca5a5}
.vc.not-given{background:#fff7ed;border-color:#fdba74}
.vt{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.vn{font-weight:800;font-size:14px;color:#1a1a2e;flex:1;min-width:0;margin-right:6px}
.vg{font-size:9px;font-weight:800;padding:2px 8px;border-radius:16px;white-space:nowrap;flex-shrink:0;color:#fff;text-transform:uppercase;letter-spacing:.3px}
.vg.give-now{background:#15803d}.vg.upcoming{background:#a16207}.vg.missed{background:#dc2626}.vg.not-given{background:#c2410c}
.vd{font-size:12.5px;color:#555;margin-top:6px;line-height:1.6}.vd strong{font-weight:700;color:#333}
.dw{color:#f59e0b;font-weight:700;font-size:11px;margin-top:2px}.ap{color:#00b340;font-style:italic;font-size:11px}.nt2b{color:#14532d;font-weight:700;font-size:11px;margin-top:2px}
.ck{background:#fff;border:2px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:12px}
.ck h3{font-weight:800;font-size:14px;color:#14532d;margin-bottom:5px}.ck .su{font-size:11px;color:#3f3f4688;margin-bottom:10px}
.cl{font-size:10px;font-weight:800;color:#00b340;margin:8px 0 3px;text-transform:uppercase;letter-spacing:.5px}
.cx{display:flex;align-items:center;padding:7px 0;cursor:pointer;border-bottom:1px solid #e2e8f0}
.cx input{margin-right:9px;width:18px;height:18px;cursor:pointer;flex-shrink:0;-webkit-appearance:auto;appearance:auto}
.cx span{font-size:13px;color:#3f3f46;font-weight:600}
.bt{width:100%;padding:13px;background:#00b340;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer;margin-top:8px;font-family:inherit;transition:transform .15s}.bt:active{transform:scale(.97)}
.dn{text-align:center;padding:18px;color:#15803d;font-weight:800;font-size:15px;margin-top:12px;background:#dcfce7;border-radius:12px;border:2px solid #4ade80}
.ib{border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:13px;line-height:1.5;font-weight:600}
.ib.am{background:#fffbeb;border:2px solid #fcd34d;color:#92400e}.ib.gn{background:#dcfce7;border:2px solid #4ade80;color:#065f46}
.bb{background:#fff;border-radius:14px;border:2px solid #e2e8f0;padding:10px 4px 4px;margin-bottom:12px}.bb h4{text-align:center;font-weight:800;font-size:13px;color:#14532d;margin-bottom:3px}
.today-bar{background:#fff;border:1.5px solid #15803d;border-radius:8px;padding:4px 12px;margin-bottom:8px;display:inline-flex;align-items:center}
.today-bar .td-label{font-size:11px;font-weight:700;color:#3f3f46;opacity:.6;margin-right:6px}
.today-bar .td-date{font-size:12px;font-weight:800;color:#14532d}
.date-grp{margin:10px 0 6px;padding:8px 12px;background:linear-gradient(135deg,#fef9c3,#fefce8);border-left:4px solid #d97706;border-radius:0 10px 10px 0;font-weight:900;font-size:14px;color:#92400e;letter-spacing:.3px}
.lang-tog{display:flex;align-items:center;margin-left:10px;flex-shrink:0}
.lang-tog span{font-size:11px;font-weight:700;color:rgba(255,255,255,.5);transition:color .2s}
.lang-tog span.active{color:#fff}
.tog-track{width:40px;height:22px;border-radius:11px;background:rgba(255,255,255,.2);margin:0 6px;position:relative;cursor:pointer;border:1px solid rgba(255,255,255,.15)}
.tog-track .tog-knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:1px;left:1px;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tog-track.hi .tog-knob{left:19px}
.tog-track.hi{background:rgba(217,119,6,.5)}








.bb svg{display:block;margin:0 auto;width:100%;max-width:300px}

function babyDiag(lmInfo,showSub){
  var keys=Object.keys(lmInfo);
  if(!keys.length)return"";
  var s='<div style="text-align:center;margin:12px 0"><h4 style="font-size:22px;font-weight:900;color:#14532d;margin-bottom:8px">\ud83d\udc89 '+t("inj-sites")+'</h4>';
  if(showSub)s+='<div style="font-size:12px;color:#3f6b3f;font-weight:600;margin-bottom:6px;font-style:italic">'+t("inj-sub")+'</div>';
  s+='<svg viewBox="-220 30 1066 590" style="width:100%;display:block;margin:0 auto">';
  /* Baby image */
  s+='<image href="'+BABY_B64+'" x="0" y="0" width="626" height="626"/>';
  
  /* === LEFT/RIGHT OVERLAY HALVES === */
  /* Baby RIGHT side = viewer LEFT (x: 0 to 313) = BLUE */
  s+='<rect x="90" y="60" width="223" height="520" rx="12" fill="#0066ff" opacity="0.08"/>';
  s+='<text x="200" y="100" text-anchor="middle" fill="#0066ff" font-size="28" font-weight="900" opacity="0.5" font-family="Source Sans 3,sans-serif">RIGHT</text>';
  
  /* Baby LEFT side = viewer RIGHT (x: 313 to 626) = PINK */
  s+='<rect x="313" y="60" width="223" height="520" rx="12" fill="#e6007a" opacity="0.08"/>';
  s+='<text x="425" y="100" text-anchor="middle" fill="#e6007a" font-size="28" font-weight="900" opacity="0.5" font-family="Source Sans 3,sans-serif">LEFT</text>';
  
  /* === INJECTION SITE MARKERS === */
  for(var i=0;i<keys.length;i++){
    var k=keys[i];
    var sp=SITE_POS[k]; if(!sp)continue;
    var routes=lmInfo[k];
    var cx=sp.cx,cy=sp.cy,c=sp.col;
    
    /* glow */
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="28" fill="'+c+'" opacity=".15"><animate attributeName="r" values="28;42;28" dur="1.5s" repeatCount="indefinite"/></circle>';
    /* dot */
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="16" fill="'+c+'" stroke="#fff" stroke-width="4"/>';
    /* cross */
    s+='<line x1="'+(cx-7)+'" y1="'+cy+'" x2="'+(cx+7)+'" y2="'+cy+'" stroke="#fff" stroke-width="4" stroke-linecap="round"/>';
    s+='<line x1="'+cx+'" y1="'+(cy-7)+'" x2="'+cx+'" y2="'+(cy+7)+'" stroke="#fff" stroke-width="4" stroke-linecap="round"/>';
    
    /* Build label - just body part + route, no LEFT/RIGHT needed */
    var lbl1=sp.part;
    var lbl2="("+routes.join(", ")+")";
    if(k==="or")lbl2="(Drops)";
    
    var lx=cx+sp.lx, ly=cy+sp.ly;
    var bw=220, bh=62;
    if(k==="or"){bw=160;bh=52;}
    
    /* callout line */
    var lnx=sp.lx<0?lx+bw:lx;
    s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+lnx+'" y2="'+(ly+bh/2)+'" stroke="'+c+'" stroke-width="3" opacity=".7"/>';
    /* box */
    s+='<rect x="'+lx+'" y="'+ly+'" width="'+bw+'" height="'+bh+'" rx="10" fill="rgba(0,0,0,0.85)"/>';
    /* text */
    s+='<text x="'+(lx+bw/2)+'" y="'+(ly+24)+'" text-anchor="middle" fill="#fff" font-size="20" font-weight="800" font-family="Source Sans 3,sans-serif">'+lbl1+'</text>';
    s+='<text x="'+(lx+bw/2)+'" y="'+(ly+48)+'" text-anchor="middle" fill="#ffffffaa" font-size="16" font-weight="700" font-family="Source Sans 3,sans-serif">'+lbl2+'</text>';
  }
  

  
  s+='</svg></div>';
  return s;
}

/* VACCINE CARD */
function cH(v,cls){
  var st=cls||v.status;
  var showDose=v.dose;
  if(v.dose==="bcg")showDose=bcgDose();
  var uid=_vcIdx++;
  var clickAttr="";
  if(v.lb)clickAttr=' onclick="togSite('+uid+",\'"+v.lb+"\'"+",\'"+v.rt+"\'"+')" style="cursor:pointer"';
  var h='<div class="vc '+st+'" id="vc-card-'+uid+'"'+clickAttr+'>';
  h+='<div class="vt"><div class="vn">'+v.nm+'</div><span class="vg '+st+'">'+t(st)+'</span></div><div class="vd">';
  if(v.schedDate)h+='<div>\ud83d\udcc5 '+v.schedDate+'</div>';
  if(showDose)h+='<div>\ud83d\udc89 <strong>'+t("dose")+':</strong> '+showDose+' | <strong>'+t("route")+':</strong> '+v.rt+'</div>';
  if(v.site&&v.site!=="Oral")h+='<div>\ud83d\udccd <strong>'+t("site")+':</strong> '+v.site+'</div>';
  if(v.dil)h+='<div class="dw">'+t("dil")+'</div>';
  if(v.ap)h+='<div class="ap">'+t("ap")+'</div>';
  if(v.preNote)h+='<div style="color:#dc2626;font-weight:800;font-size:11px;margin-top:3px;background:#fef2f2;padding:3px 8px;border-radius:6px;border-left:3px solid #dc2626">\u26a0\ufe0f '+v.preNote+'</div>';
  if(v.note)h+='<div style="color:#14532d;font-weight:700;font-size:11px;margin-top:2px">\u2139\ufe0f '+v.note+'</div>';
  if(v.lb)h+='<div style="color:#6b7280;font-size:10px;margin-top:4px;text-align:right;font-style:italic">'+(L==="hi"?"\u091f\u0948\u092a \u0915\u0930\u0947\u0902 \u0938\u093e\u0907\u091f \u0926\u0947\u0916\u0947\u0902":"Tap to see injection site")+'</div>';
  return h+'</div></div>';}

/* DATE-WISE UPCOMING */
function upByDate(list,pfx){
  /* Filter out past dates */
  var today_sk=fDsort(tdy());
  list=list.filter(function(v){return !v._sk||v._sk>=today_sk});
  if(!list.length)return'';
  list.sort(function(a,b){return(a._sk||0)-(b._sk||0)});
  var h='<div class="sh2 up collapse-hdr" id="'+pfx+'-up-hdr" onclick="toggleCollapse(\''+pfx+'-up\')"><strong>'+t("up-sec")+'</strong><span class="sc">'+list.length+'</span></div><div class="collapse-body" id="'+pfx+'-up-body">';
  var ld="";list.forEach(function(v){if(v.schedDate!==ld){ld=v.schedDate;h+='<div class="date-grp">\ud83d\udcc6 '+ld+'</div>'}h+=cH(v)});
  return h+'</div>';
}

/* NOT-TO-BE-GIVEN DROPDOWN */
